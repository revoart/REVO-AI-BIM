[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revoai-engine"
version = "0.7.2"
description = "Revo AI BIM local processing engine (point clouds, AI, reconstruction)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RevoStudioz" }]
dependencies = [
    "pydantic>=2.9,<3",
    "numpy>=2.0,<3",
    "scipy>=1.14",
    "open3d>=0.20,<0.21",
    "laspy>=2.6",
    "lazrs>=0.7",
    "pye57>=0.4.19",
]

[project.scripts]
revoai-engine = "revoai_engine.service:main"

[tool.setuptools]
packages = ["revoai_engine", "revoai_engine.pointcloud", "revoai_engine.analysis", "revoai_engine.reconstruction", "revoai_engine.knowledge"]
